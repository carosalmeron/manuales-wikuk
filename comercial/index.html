<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tus ventas y pedidos · Guía</title>
<style>
  :root{
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Monaco,'Courier New',monospace;
    --tinta:#15181d; --papel:#eef1f4; --azul:#1f5fa8;
    --rojo:#c62f2f; --ambar:#c2660c; --verde:#2f7d52;
    --linea:#c9d2dc; --humo:#5f6a76;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--tinta);color:var(--tinta);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;background:var(--papel);min-height:100dvh;
    position:relative;display:flex;flex-direction:column}
  /* Mismo papel punteado que el indice de manuales */
  .wrap::before{content:"";position:fixed;inset:0;max-width:480px;margin:0 auto;
    pointer-events:none;z-index:0;
    background-image:radial-gradient(var(--linea) .5px,transparent .5px);
    background-size:15px 15px;opacity:.4}

  header{position:relative;z-index:1;padding:22px 22px 16px;
    border-bottom:1.5px solid var(--tinta)}
  .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--azul);
    text-transform:uppercase;margin-bottom:7px}
  h1{font-weight:900;font-size:26px;line-height:1.02;letter-spacing:-.03em;
    text-transform:uppercase}
  .barra{height:3px;background:#dbe1e8;border-radius:99px;margin-top:14px;
    border:1px solid var(--linea)}
  .barra i{display:block;height:100%;background:var(--azul);border-radius:99px;
    transition:width .28s ease}

  main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:22px}
  .paso{animation:entra .2s ease}
  @keyframes entra{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.paso{animation:none}}

  .num{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--humo)}
  h2{margin:7px 0 13px;font-size:21px;font-weight:900;letter-spacing:-.02em;
    line-height:1.2}
  p{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:#252b32}
  strong{font-weight:800;color:var(--tinta)}
  em{font-style:italic}

  /* Pantalla de ejemplo: mismo trazo y sombra dura que las tarjetas */
  .pantalla{background:#fff;border:1.5px solid var(--tinta);border-radius:9px;
    padding:14px 15px;margin:14px 0;box-shadow:3px 3px 0 rgba(21,24,29,.08)}
  .et{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--humo)}
  .cifra{font-size:27px;font-weight:900;letter-spacing:-.03em;margin:4px 0 0;
    font-variant-numeric:tabular-nums}
  .sub{font-size:12px;color:var(--humo);margin:3px 0 0}
  .fila{display:flex;align-items:flex-start;gap:12px}
  .fila>div{min-width:0}
  .pct{margin-left:auto;text-align:center;border:1.5px solid var(--verde);
    border-radius:8px;padding:8px 11px;flex:none;background:#f0f7f3}
  .pct b{display:block;font-size:20px;font-weight:900;color:var(--verde);
    line-height:1.1}
  .pct span{font-family:var(--mono);font-size:8px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--humo)}
  .franja{border-top:1px dashed var(--linea);margin-top:12px;padding-top:11px;
    display:flex;gap:12px;align-items:flex-start}
  .franja .v{font-size:16px;font-weight:900;margin-top:3px}

  .nota{border-left:3px solid var(--azul);background:#e8f1fb;
    border-radius:0 8px 8px 0;padding:11px 13px;margin:14px 0;
    font-size:13.5px;line-height:1.55}
  .nota.aviso{border-left-color:var(--ambar);background:#fdf3e6}
  .nota b{font-weight:800}

  ul{margin:0 0 12px;padding-left:19px}
  li{margin-bottom:6px;font-size:14.5px;line-height:1.55;color:#252b32}

  footer{position:relative;z-index:1;flex:none;background:#fff;
    border-top:1.5px solid var(--tinta);
    padding:11px 16px calc(11px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:10px}
  button{font:inherit;font-weight:800;border-radius:9px;cursor:pointer;
    border:1.5px solid var(--tinta);background:#fff;color:var(--tinta);
    padding:12px 17px;font-size:15px;min-height:46px;
    box-shadow:2px 2px 0 rgba(21,24,29,.1)}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(21,24,29,.1)}
  button.principal{background:var(--azul);border-color:var(--azul);color:#fff;flex:1}
  button:disabled{opacity:.3;box-shadow:none}
  .cuenta{font-family:var(--mono);font-size:11.5px;color:var(--humo);
    min-width:48px;text-align:center;letter-spacing:.05em}
  a{color:var(--azul);font-weight:800}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="k">Grupo Consolidado · CRM</div>
  <h1 id="titulo">Tus ventas y tus pedidos</h1>
  <div class="barra"><i id="progreso" style="width:0%"></i></div>
</header>

<main id="main"></main>

<footer>
  <button id="atras" onclick="ir(-1)">←</button>
  <span class="cuenta" id="cuenta">1 / 10</span>
  <button class="principal" id="siguiente" onclick="ir(1)">Empezar</button>
</footer>
</div>

<script>
const PASOS = [
{
  titulo:"Tus ventas y tus pedidos",
  h:"Qué es nuevo",
  html:`
    <p>El CRM ya no muestra cifras de ejemplo. Ahora lee <strong>tus ventas
    reales</strong> del sistema de facturación, cada día.</p>
    <p>Con esta guía vas a saber tres cosas: cómo vas respecto a tu objetivo,
    cuándo sale cada pedido que has cerrado, y en qué clientes estás ganando
    o perdiendo dinero.</p>
    <div class="nota">Son <b>diez pasos</b> y se leen en un par de minutos.
    Puedes volver atrás cuando quieras.</div>`
},
{
  titulo:"Tu dashboard",
  h:"Lo primero que ves al entrar",
  html:`
    <p>Al abrir el CRM tienes tus ventas arriba del todo. Tres pestañas:
    <strong>Semana</strong>, <strong>Mes</strong> y <strong>Año</strong>.</p>
    <div class="pantalla">
      <div class="fila">
        <div>
          <div class="et">Ventas semana</div>
          <p class="cifra">18.240 €</p>
          <p class="sub">obj. 19.600 €</p>
        </div>
        <div class="pct"><b>93 %</b><span>Cumplimiento</span></div>
      </div>
    </div>
    <p>El número grande es lo facturado en el periodo. Debajo, tu objetivo.
    Y a la derecha, qué porcentaje llevas cubierto.</p>
    <div class="nota">A mitad de semana es normal ir por debajo del 100 %:
    el objetivo es de la <b>semana completa</b>.</div>`
},
{
  titulo:"Tu objetivo",
  h:"De dónde sale el objetivo",
  html:`
    <p>Si tienes presupuesto asignado, el objetivo sale de <strong>tu Excel de
    reporting</strong>, semana a semana. Es el mismo que maneja tu responsable.</p>
    <p>Si todavía no tienes presupuesto cargado, el CRM usa como referencia
    <strong>lo que vendiste el año pasado</strong> en ese mismo periodo.</p>
    <div class="nota aviso">En ese caso, un 88 % no significa que vayas por debajo
    de objetivo: significa que facturas un <b>12 % menos que el año pasado</b>.
    Son cosas distintas.</div>
    <p>En la pestaña <strong>Año</strong> la comparación es contra el objetivo
    acumulado <strong>hasta hoy</strong>, no contra el presupuesto anual entero.
    Así el porcentaje tiene sentido en julio.</p>`
},
{
  titulo:"Pedidos introducidos",
  h:"Tu trabajo de esta semana",
  html:`
    <p>La factura llega semanas después de que cierres la venta. Por eso, en la
    pestaña <strong>Semana</strong>, debajo de la barra, tienes una franja nueva.</p>
    <div class="pantalla">
      <div class="franja">
        <div>
          <div class="et">Pedidos introducidos</div>
          <p class="v">31.200 € <span style="color:var(--verde);font-size:12.5px">+16 %</span></p>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div class="et">Sale la semana que viene</div>
          <p class="v">22.900 € <span style="color:var(--verde);font-size:12.5px">117 % obj.</span></p>
        </div>
      </div>
    </div>
    <p><strong>Pedidos introducidos</strong> es lo que has metido esta semana,
    por fecha de pedido. Es tu esfuerzo comercial de estos días, aunque todavía
    no se haya facturado. El porcentaje compara con la misma semana del año pasado.</p>`
},
{
  titulo:"Previsión",
  h:"Saber antes si vas a cumplir",
  html:`
    <p>A la derecha de esa franja, <strong>Sale la semana que viene</strong>: lo que
    ya está planificado para entregarse en los próximos siete días.</p>
    <p>El porcentaje te dice cuánto de tu objetivo semanal está ya cubierto por
    pedidos cerrados.</p>
    <ul>
      <li><strong>Verde, 100 % o más</strong> — con lo que hay ya llegas.</li>
      <li><strong>Ámbar, entre 70 y 100</strong> — vas justo, conviene cerrar algo más.</li>
      <li><strong>Rojo, por debajo de 70</strong> — la semana que viene se queda corta
      si no entra nada nuevo.</li>
    </ul>
    <div class="nota">Es la parte más útil del cambio: te enteras <b>antes</b>
    de que pase la semana, no después.</div>`
},
{
  titulo:"Pedidos planificados",
  h:"Cuándo sale cada pedido",
  html:`
    <p>Desde el portal, el botón <strong>📦 Pedidos planificados</strong> abre tu lista
    de pedidos pendientes de servir.</p>
    <p>Arriba tienes el total por servir y cuántos pedidos son. Debajo, agrupados
    por fecha de salida, con tres vistas: <strong>por día</strong>, <strong>por
    semana</strong> y <strong>por mes</strong>.</p>
    <ul>
      <li>Los de <strong>hoy y mañana</strong> salen marcados en rojo.</li>
      <li>Los de <strong>esta semana</strong>, en ámbar.</li>
      <li>Pulsa una fecha para <strong>plegarla o desplegarla</strong>.</li>
    </ul>
    <p>Solo aparecen entregas de <strong>hoy en adelante</strong>. Lo ya servido
    desaparece solo.</p>`
},
{
  titulo:"Detalle del pedido",
  h:"Qué lleva cada cliente",
  html:`
    <p>Pulsa el nombre de un cliente y se abre el detalle: <strong>qué artículos</strong>
    lleva, con su descripción, el número de pedido, las unidades y el precio unitario.</p>
    <div class="pantalla">
      <div class="et">Tripa natural 38/40</div>
      <p class="sub" style="margin-top:3px">TR100 · sale mañana · A 183422 · calibre 55</p>
      <p style="margin:8px 0 0;font-weight:800">5.250 € <span class="sub"
        style="display:inline">· 150 uds · 35,00 €/u</span></p>
    </div>
    <p>Cuando agrupas por semana o por mes, cada línea indica <strong>qué día
    sale</strong>, porque un mismo cliente puede tener entregas repartidas.</p>`
},
{
  titulo:"Análisis",
  h:"Dónde ganas y dónde pierdes",
  html:`
    <p>El botón <strong>📈 Análisis</strong> del portal responde a la pregunta que
    importa: si vas por debajo del año pasado, <strong>en qué clientes</strong>.</p>
    <p>Arriba tienes un resumen en lenguaje llano, del tipo
    <em>"Vas por detrás del año pasado: faltan 47.411 € para igualarlo"</em>.
    Y debajo, tres listas:</p>
    <ul>
      <li><strong>Dónde pierdes</strong> — clientes ordenados por euros perdidos,
      con lo que facturaban antes.</li>
      <li><strong>Dónde ganas</strong> — los que están compensando.</li>
      <li><strong>Dejaron de comprar</strong> — sin ventas este año pero con
      más de 1.000 € el pasado, con la fecha de su última compra.</li>
    </ul>
    <div class="nota">Esa tercera lista es tu <b>lista de recuperación</b>:
    clientes que ya te compraban y han dejado de hacerlo.</div>`
},
{
  titulo:"Tu cartera",
  h:"Cuántos clientes tienes activos",
  html:`
    <p>En la misma pantalla de Análisis ves tu cartera: cuántos clientes tienes
    asignados, cuántos han comprado <strong>este mes</strong> y cuántos no.</p>
    <p>También tu <strong>margen</strong> real frente a tu objetivo de margen,
    con la desviación en puntos.</p>
    <div class="nota aviso">El margen se calcula descartando las líneas cuyo coste
    está mal grabado en el maestro de artículos. Por eso puede no coincidir al
    céntimo con otros informes.</div>`
},
{
  titulo:"Cuándo se actualiza",
  h:"Con qué frecuencia entran los datos",
  html:`
    <p>Los datos se refrescan <strong>una vez al día, a las 13:00</strong>. Lo que
    factures o pidas después aparecerá al día siguiente.</p>
    <p>Al pie de Análisis y de Pedidos verás la fecha del último dato. Si algún día
    indica que lleva <strong>dos días o más</strong> sin actualizarse, avisa: significa
    que la sincronización ha fallado.</p>
    <div class="nota">Si una cifra no te cuadra, dilo con el <b>cliente y el importe</b>
    concretos. Con eso se puede rastrear hasta la línea de factura.</div>
    <p style="margin-top:18px"><a href="../">← Volver a los manuales</a></p>`
}
];

const $=(id)=>document.getElementById(id);
let i=0, arrancado=false;

function pinta(){
  const p=PASOS[i];
  $("titulo").textContent=p.titulo;
  $("main").innerHTML=`<div class="paso">
    <div class="num">Paso ${i+1} de ${PASOS.length}</div>
    <h2>${p.h}</h2>
    ${p.html}
  </div>`;
  $("main").scrollTop=0;
  $("progreso").style.width=((i+1)/PASOS.length*100)+"%";
  $("cuenta").textContent=`${i+1} / ${PASOS.length}`;
  $("atras").disabled = i===0;
  $("siguiente").textContent = i===PASOS.length-1 ? "Terminar" : "Siguiente";
}

function ir(d){
  if(!arrancado){ arrancado=true; pinta(); return; }
  if(d>0 && i===PASOS.length-1){ location.href="../"; return; }
  i=Math.min(PASOS.length-1, Math.max(0, i+d));
  pinta();
}

// Deslizar con el dedo, que en móvil es lo natural
let x0=null;
document.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>60) ir(dx<0?1:-1);
  x0=null;
},{passive:true});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") ir(1);
  if(e.key==="ArrowLeft")  ir(-1);
});

pinta();
arrancado=true;
</script>
</body>
</html>
